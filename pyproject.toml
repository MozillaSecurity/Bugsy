[project]
name = "mozsec-bugsy"
version = "0.13.0"
description = "A library for interacting Bugzilla Native REST API"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "David Burns", email = "david.burns@theautomatedtester.co.uk" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["requests>=1.1.0"]

[project.urls]
Repository = "https://github.com/MozillaSecurity/Bugsy"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "responses>=0.25.0",
]
release = [
    "build>=1.2.0",
    "python-semantic-release>=10.1,<11",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.semantic_release]
build_command = "uv build"
commit_message = "chore(release): {version} [skip ci]"
commit_parser = "conventional"
tag_format = "v{version}"
version_variables = ["pyproject.toml:project.version"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
